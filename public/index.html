const ICONS={Dashboard:'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z',Students:'M16 8a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 20c0-3.3 3.6-5 8-5s8 1.7 8 5',Subjects:'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',Marks:'M5 4h14v16H5zM8 9h8M8 13h5M8 17h3',Fees:'M7 5h10M7 9h10M9 5c5 0 5 5 0 5H8l7 9',Attendance:'M4 5h16v15H4zM8 12l3 3 5-6','At-risk':'M12 3l10 18H2zM12 10v5M12 18h.01',Admissions:'M15 8a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM3 20c0-3 3-5 7-5M18 14v6M15 17h6',Leave:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',Ask:'M4 5h16v11H9l-5 4zM8 9h8M8 12h5',Audit:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'};

const goTab=n=>{const i=TABS[S.role].findIndex(t=>t[0]===n);if(i>=0)$('#nav').children[i].click()};

  d.append(h('h2',{style:'font-size:18px;margin-bottom:4px'},title),input?h('p',{class:'mut',style:'margin:0;font-size:14px'},label):h('p',{class:'mut'},label),...(input?[i]:[]),h('div',{class:'row',style:'justify-content:flex-end;margin:8px 0 0'},h('button',{class:'btn s',onclick:()=>done(null)},'Cancel'),h('button',{class:'btn',onclick:()=>done(input?i.value:true)},confirmText)));

  draw();return h('div',{class:'wrap'},h('table',{},h('thead',{},head),tb))};
const pct=a=>a==null?h('span',{class:'mut'},'—'):h('span',{class:a<75?'bad':'ok'},a+'%');
async function students(){const s=await api('students');localStorage.setItem('roster',JSON.stringify(s));const box=h('div',{}),q=h('input',{type:'search',placeholder:'Search name or roll no','aria-label':'Search students',style:'width:100%;max-width:320px;margin-bottom:12px'});

let unsaved=false;

  let dirty=false;const q=h('input',{type:'search',placeholder:'Search student','aria-label':'Search student',oninput:()=>draw(),style:'flex:1;min-width:150px'}),onlyAbs=h('input',{type:'checkbox','aria-label':'Show absent only',onchange:()=>draw()});
